<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스크린타임 챌린지 출석부</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --paper:#fffdf7; --ink:#3f4145; --muted:#77736c;
  --yellow:#ffe58a; --green:#b9dfb1; --blue:#b9dff0; --pink:#f6c4c9;
  --orange:#ffc98d; --line:#ded9ce; --white:#fff;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:#f5f0e5;
  font-family:'Nunito','Malgun Gothic',sans-serif;
  min-height:100vh;
}
body:before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.35;
  background-image:radial-gradient(#aaa 0.6px,transparent .7px);
  background-size:7px 7px;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:28px 22px 50px;position:relative}
header{
  display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px
}
.logo{
  font-family:'Jua',sans-serif;font-size:38px;letter-spacing:-1.5px;
  transform:rotate(-1deg);display:inline-block;
}
.logo span{background:var(--yellow);padding:2px 11px 5px;border-radius:10px 4px 12px 5px}
.subtitle{font-size:14px;color:var(--muted);margin-top:5px}
.top-actions{display:flex;gap:8px}
.btn{
  border:2px solid var(--ink);background:var(--white);border-radius:12px;
  padding:9px 14px;font-weight:800;box-shadow:2px 3px 0 var(--ink);
}
.btn:active{transform:translate(2px,3px);box-shadow:none}
.btn.yellow{background:var(--yellow)}
.btn.green{background:var(--green)}
.btn.small{font-size:13px;padding:7px 10px}
.card{
  background:rgba(255,253,247,.94);border:2px solid var(--ink);border-radius:18px;
  box-shadow:4px 5px 0 rgba(63,65,69,.14);padding:20px;
}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{
  border:2px solid var(--ink);background:#eeeae1;border-radius:12px;padding:9px 17px;
  font-weight:800;color:#666;box-shadow:2px 2px 0 rgba(63,65,69,.2)
}
.tab.active{background:var(--yellow);color:var(--ink)}
.view{display:none}.view.active{display:block}
.datebar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px
}
.date-title{font-family:'Jua';font-size:25px}
.date-controls{display:flex;align-items:center;gap:6px}
.iconbtn{
  width:36px;height:36px;border:2px solid var(--ink);border-radius:10px;background:#fff
}
input[type=date]{
  border:2px solid var(--ink);border-radius:10px;padding:7px 9px;background:#fff
}
.summary{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px
}
.pill{
  border:2px solid var(--ink);border-radius:999px;padding:7px 12px;background:#fff;
  font-weight:800;font-size:14px
}
.pill.done{background:var(--green)} .pill.left{background:var(--pink)}
.student-grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px
}
.student{
  position:relative;border:2px solid var(--ink);border-radius:14px;background:#fff;
  min-height:82px;padding:12px;display:flex;align-items:center;justify-content:space-between;
  gap:7px;transition:.12s
}
.student:hover{transform:translateY(-2px)}
.student.done{background:#eef8eb}
.student .name{font-weight:800;font-size:16px}
.check{
  width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);
  background:#f3efe6;font-size:21px;display:grid;place-items:center;flex:none
}
.student.done .check{background:var(--green)}
.empty{
  grid-column:1/-1;text-align:center;padding:35px;color:var(--muted)
}
.manage{
  margin-top:15px;padding-top:15px;border-top:2px dashed var(--line);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.manage input{
  border:2px solid var(--ink);border-radius:10px;padding:9px 11px;width:190px;background:#fff
}
.student-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.name-chip{
  border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 8px 5px 11px;
  display:flex;align-items:center;gap:5px;font-weight:700
}
.name-chip button{border:0;background:none;font-weight:900;color:#888}
.stats-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.stats-head h2{font-family:'Jua';font-size:25px;margin:0}
.select{
  border:2px solid var(--ink);border-radius:10px;padding:8px 11px;background:#fff;font-weight:700
}
.chart-wrap{height:360px;position:relative}
.bar-chart{height:100%;min-width:100%;display:flex;align-items:end;gap:10px;padding:25px 8px 30px;border-bottom:2px solid var(--ink);overflow-x:auto}
.bar-col{height:100%;flex:1 0 58px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;min-width:0}
.bar-value{font-weight:800;font-size:13px}
.bar{
  width:min(48px,80%);border:2px solid var(--ink);border-bottom:3px solid var(--ink);
  border-radius:9px 9px 3px 3px;background:var(--blue);min-height:3px;
  transition:height .3s
}
.bar:nth-child(odd){background:var(--green)}
.bar-label{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chart-note{font-size:13px;color:var(--muted);margin-top:9px}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.mini{
  border:2px solid var(--ink);border-radius:14px;padding:13px;background:#fff
}
.mini .label{font-size:12px;color:var(--muted);font-weight:700}.mini .num{font-family:'Jua';font-size:26px;margin-top:2px}
.help{
  margin-top:15px;background:#fff8d9;border:2px dashed #b9a45e;border-radius:13px;
  padding:11px 13px;font-size:13px;line-height:1.6
}
@media(max-width:850px){.student-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){
  .app{padding:18px 12px}.logo{font-size:30px}header{align-items:start;flex-direction:column}
  .student-grid{grid-template-columns:repeat(2,1fr)}.student{min-height:72px}.chart-wrap{height:310px}
  .stat-cards{grid-template-columns:1fr 1fr}.top-actions{width:100%}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="logo">📱 <span>스크린타임 챌린지</span></div>
    <div class="subtitle">오늘 인증했는지 가볍게 체크해요 ✏️</div>
  </div>
  <div class="top-actions">
    <button class="btn yellow" onclick="showView('check')">오늘 체크</button>
    <button class="btn green" onclick="showView('stats')">통계 보기</button>
  </div>
</header>

<div class="tabs">
  <button id="tab-check" class="tab active" onclick="showView('check')">오늘의 인증</button>
  <button id="tab-stats" class="tab" onclick="showView('stats')">주간 통계</button>
</div>

<section id="check" class="view active card">
  <div class="datebar">
    <div class="date-title" id="dateTitle"></div>
    <div class="date-controls">
      <button class="iconbtn" onclick="moveDate(-1)">‹</button>
      <input type="date" id="dateInput" onchange="changeDate(this.value)">
      <button class="iconbtn" onclick="moveDate(1)">›</button>
      <button class="btn small" onclick="goToday()">오늘</button>
    </div>
  </div>

  <div class="summary">
    <div class="pill done" id="doneCount">인증 0명</div>
    <div class="pill left" id="leftCount">미인증 0명</div>
    <div class="pill" id="rateCount">달성률 0%</div>
  </div>

  <div id="studentGrid" class="student-grid"></div>

  <div class="manage">
    <input id="nameInput" placeholder="학생 이름 추가" onkeydown="if(event.key==='Enter')addStudent()">
    <button class="btn small green" onclick="addStudent()">+ 학생 추가</button>
    <button class="btn small" onclick="resetToday()">오늘 기록 전체 초기화</button>
  </div>
  <div id="studentList" class="student-list"></div>

  <div class="help">
    💡 학생에게 인증샷을 받은 날에 이름을 한 번 눌러주세요. <b>날짜별로 기록</b>되기 때문에
    다음 날에는 새로 체크할 수 있고, 지난 날짜의 기록도 다시 확인할 수 있어요.
  </div>
</section>

<section id="stats" class="view card">
  <div class="stats-head">
    <h2 id="statsTitle">학생별 주간 인증</h2>
    <div>
      <select id="statsMode" class="select" onchange="renderStats()">
        <option value="student">학생별</option>
        <option value="week">주별</option>
      </select>
      <select id="studentSelect" class="select" onchange="renderStats()"></select>
      <select id="weekSelect" class="select" onchange="renderStats()" style="display:none"></select>
    </div>
  </div>
  <div class="chart-wrap"><div id="chart" class="bar-chart"></div></div>
  <div class="chart-note" id="chartNote"></div>
  <div class="stat-cards" id="statCards"></div>
</section>
</div>

<script>
const KEY_STUDENTS='screenChallenge_students_v1';
const KEY_RECORDS='screenChallenge_records_v1';

let students = JSON.parse(localStorage.getItem(KEY_STUDENTS) || 'null') || [
  '김민준','이서윤','박지호','최하윤','정도윤','김지아','이준서','박서연',
  '최민재','한유진','강도현','윤서준','송하린','조현우','배수아','임지후',
  '오지민','문예준','장서윤'
];
let records = JSON.parse(localStorage.getItem(KEY_RECORDS) || '{}');
let selectedDate = today();

function save(){
  localStorage.setItem(KEY_STUDENTS, JSON.stringify(students));
  localStorage.setItem(KEY_RECORDS, JSON.stringify(records));
}
function pad(n){return String(n).padStart(2,'0')}
function today(){
  const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmt(s){
  const d=dateObj(s), days=['일','월','화','수','목','금','토'];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function showView(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(v).classList.add('active');
  document.getElementById('tab-'+(v==='check'?'check':'stats')).classList.add('active');
  if(v==='stats')renderStats();
}
function render(){
  document.getElementById('dateTitle').textContent=fmt(selectedDate);
  document.getElementById('dateInput').value=selectedDate;
  const day=records[selectedDate] || {};
  let done=0;
  const grid=document.getElementById('studentGrid');
  grid.innerHTML='';
  if(!students.length){grid.innerHTML='<div class="empty">학생을 먼저 추가해 주세요 ✏️</div>'}
  students.forEach((name,i)=>{
    const isDone=!!day[name]; if(isDone)done++;
    const el=document.createElement('button');
    el.className='student'+(isDone?' done':'');
    el.innerHTML=`<span class="name">${escapeHtml(name)}</span><span class="check">${isDone?'✓':'○'}</span>`;
    el.onclick=()=>toggle(name);
    grid.appendChild(el);
  });
  const total=students.length, left=total-done, rate=total?Math.round(done/total*100):0;
  document.getElementById('doneCount').textContent=`인증 ${done}명`;
  document.getElementById('leftCount').textContent=`미인증 ${left}명`;
  document.getElementById('rateCount').textContent=`달성률 ${rate}%`;
  document.getElementById('studentList').innerHTML=students.map((n,i)=>
    `<span class="name-chip">${escapeHtml(n)}<button title="학생 삭제" onclick="removeStudent(${i})">×</button></span>`).join('');
  save();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggle(name){
  if(!records[selectedDate])records[selectedDate]={};
  if(records[selectedDate][name])delete records[selectedDate][name];
  else records[selectedDate][name]=true;
  render();
}
function changeDate(v){if(v){selectedDate=v;render()}}
function moveDate(delta){
  const d=dateObj(selectedDate);d.setDate(d.getDate()+delta);
  selectedDate=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;render();
}
function goToday(){selectedDate=today();render()}
function addStudent(){
  const input=document.getElementById('nameInput'), name=input.value.trim();
  if(!name)return;
  if(students.includes(name)){alert('이미 있는 학생이에요.');return}
  students.push(name);input.value='';save();render();
}
function removeStudent(i){
  const name=students[i];
  if(!confirm(`'${name}' 학생을 목록에서 삭제할까요?\\n기존 날짜 기록은 남아 있습니다.`))return;
  students.splice(i,1);save();render();
}
function resetToday(){
  if(confirm(`${fmt(selectedDate)}의 인증 기록을 모두 지울까요?`)){
    delete records[selectedDate];save();render();
  }
}
function startOfWeek(s){
  const d=dateObj(s), day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return d;
}
function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function weekDates(base){
  const d=startOfWeek(base), arr=[];
  for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);arr.push(iso(x))}
  return arr;
}
function countStudentWeek(name,dates){
  return dates.reduce((n,d)=>n+(records[d]?.[name]?1:0),0);
}
function renderStats(){
  const mode=document.getElementById('statsMode').value;
  const studentSelect=document.getElementById('studentSelect');
  const weekSelect=document.getElementById('weekSelect');
  const chart=document.getElementById('chart');
  const title=document.getElementById('statsTitle');

  studentSelect.style.display=mode==='student'?'inline-block':'none';
  weekSelect.style.display=mode==='week'?'inline-block':'none';

  if(mode==='student'){
    studentSelect.innerHTML=students.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
    renderStudentStats();
  }else{
    buildWeekOptions();
    renderWeekStats();
  }
}

function buildWeekOptions(){
  const select=document.getElementById('weekSelect');
  const current=startOfWeek(selectedDate);
  const options=[];
  for(let i=0;i<12;i++){
    const d=new Date(current); d.setDate(current.getDate()-i*7);
    const monday=iso(d);
    const sunday=new Date(d); sunday.setDate(d.getDate()+6);
    options.push({
      value:monday,
      label:`${d.getMonth()+1}/${d.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()}`
    });
  }
  const currentValue=select.value || iso(current);
  select.innerHTML=options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('');
  if(options.some(o=>o.value===currentValue)) select.value=currentValue;
}

function renderStudentStats(){
  const name=document.getElementById('studentSelect').value||students[0]||'학생';
  const dates=weekDates(selectedDate), labels=['월','화','수','목','금','토','일'];
  const data=dates.map((d,i)=>({label:labels[i],value:records[d]?.[name]?1:0}));
  document.getElementById('statsTitle').textContent=`${name}의 주간 인증`;

  renderBars(data, 1);
  const total=data.reduce((a,b)=>a+b.value,0);
  document.getElementById('chartNote').textContent=
    `주간 기준: ${fmt(dates[0])} ~ ${fmt(dates[6])} · 인증한 날 ${total}일`;

  const possible=7;
  document.getElementById('statCards').innerHTML=`
    <div class="mini"><div class="label">이번 주 인증</div><div class="num">${total}일</div></div>
    <div class="mini"><div class="label">가능한 최대 인증</div><div class="num">${possible}일</div></div>
    <div class="mini"><div class="label">주간 달성률</div><div class="num">${Math.round(total/possible*100)}%</div></div>`;
}

function renderWeekStats(){
  const monday=document.getElementById('weekSelect').value || iso(startOfWeek(selectedDate));
  const dates=weekDates(monday);
  const data=students.map(name=>({
    label:name,
    value:countStudentWeek(name,dates)
  }));
  document.getElementById('statsTitle').textContent='주별 학생별 인증';

  // 학생 수가 많아도 이름이 잘 보이도록 최대 7회 기준으로 표시
  renderBars(data, 7);

  const total=data.reduce((a,b)=>a+b.value,0);
  const possible=students.length*7;
  document.getElementById('chartNote').textContent=
    `선택한 주: ${fmt(dates[0])} ~ ${fmt(dates[6])} · 학생별 인증 횟수(최대 7회)`;

  document.getElementById('statCards').innerHTML=`
    <div class="mini"><div class="label">이번 주 전체 인증</div><div class="num">${total}회</div></div>
    <div class="mini"><div class="label">학생 1명당 최대</div><div class="num">7회</div></div>
    <div class="mini"><div class="label">반 전체 달성률</div><div class="num">${possible?Math.round(total/possible*100):0}%</div></div>`;
}

function renderBars(data, fixedMax){
  const chart=document.getElementById('chart');
  chart.innerHTML='';
  const max=Math.max(fixedMax||1,...data.map(x=>x.value));
  data.forEach(x=>{
    const col=document.createElement('div'); col.className='bar-col';
    const val=document.createElement('div'); val.className='bar-value'; val.textContent=x.value;
    const bar=document.createElement('div'); bar.className='bar';
    bar.style.height=`${Math.max(3,x.value/max*82)}%`;
    const lab=document.createElement('div'); lab.className='bar-label'; lab.textContent=x.label;
    col.append(val,bar,lab); chart.appendChild(col);
  });
}
document.getElementById('statsMode').addEventListener('change',()=>renderStats());
render();
</script>
</body>
</html>
